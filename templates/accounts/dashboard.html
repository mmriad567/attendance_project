{% extends "base.html" %}

{% block title %}Dashboard · {{ INSTITUTE_NAME }}{% endblock %}

{% block content %}
<div class="rounded-lg bg-white p-8 shadow">
    <h1 class="text-2xl font-bold text-slate-900">
        Welcome, {{ user.get_full_name|default:user.username }}
    </h1>
    <p class="mt-2 text-slate-600">
        You are signed in as
        <span class="font-medium capitalize">{{ user.get_role_display }}</span>.
    </p>
    <p class="mt-4 rounded-md bg-slate-50 px-4 py-3 text-sm text-slate-500">
        Role-specific dashboards arrive in the next steps.
    </p>
</div>
{% endblock %}
